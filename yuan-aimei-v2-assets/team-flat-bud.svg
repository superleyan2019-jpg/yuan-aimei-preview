<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1122" width="120" height="374">
  <title>吳佩錚照片左側花苞植物｜依可見輪廓描繪的平塗確認稿</title>
  <desc>對應參考圖 x=0,y=700,width=120,height=374 的可見範圍。保留畫面外裁切，不補畫不可見枝葉。可編輯向量路徑，無點陣圖、濾鏡及漸層。</desc>
  <g transform="translate(-30 -30)">
