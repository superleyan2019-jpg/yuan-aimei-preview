    <path fill="#b8d8a7" d="M148 298 C129 276 111 246 104 218 C96 192 97 167 105 150 C111 134 122 142 130 155 C135 163 141 176 144 188 C145 162 153 139 166 120 C175 107 183 105 188 118 C196 137 194 166 189 187 C196 183 201 182 206 181 C207 200 198 226 186 247 C175 267 161 283 148 298Z"/>
